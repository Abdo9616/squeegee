name: Build

on:
  push:
  pull_request:

jobs:
  fabric-26-1:
    name: Fabric 26.1
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fabric/26.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - run: ./gradlew build --no-daemon

  fabric-26:
    name: Fabric ${{ matrix.minecraft }}
    strategy:
      matrix:
        minecraft: [26.1.1, 26.1.2, 26.2, 26.3]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fabric/${{ matrix.minecraft }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - run: ./gradlew build --no-daemon

  forge-1-20-1:
    name: Forge 1.20.1
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forge/1.20.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - run: ./gradlew build --no-daemon

  forge-26:
    name: Forge ${{ matrix.minecraft }}
    strategy:
      matrix:
        minecraft: [26.1, 26.1.1, 26.1.2, 26.2, 26.3]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forge/${{ matrix.minecraft }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - run: ./gradlew build --no-daemon
